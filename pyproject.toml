[project]
name = "lob-document"
version = "0.1.0"
description = "A learning implementation of traceable document parsing for AI and RAG"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pymupdf>=1.26,<2",
    "pydantic>=2.11,<3",
    "pypdf>=6,<7",
    "python-dotenv>=1.1,<2",
]

[project.scripts]
lob-document = "lob_document.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lob_document"]
